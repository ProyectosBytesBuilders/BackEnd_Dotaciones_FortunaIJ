info:
  name: Actualizar PQRS parcialmente
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/pqrs/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "{{pqrsId}}"
      type: path
  body:
    type: json
    data: |
      {
        "estado": "resuelto"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
