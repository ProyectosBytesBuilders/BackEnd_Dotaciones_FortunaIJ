info:
  name: Actualizar PQRS completa
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/pqrs/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "{{pqrsId}}"
      type: path
  body:
    type: json
    data: |
      {
        "tipo": "reclamo",
        "descripcion": "Presento un reclamo por el estado de mi pedido de dotaciones.",
        "archivo_adjunto": null,
        "estado": "en_revision",
        "anonimo": false,
        "id_cliente": 1
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
