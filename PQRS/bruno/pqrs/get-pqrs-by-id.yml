info:
  name: Consultar PQRS por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/pqrs/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "{{pqrsId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
